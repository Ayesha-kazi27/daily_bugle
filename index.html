    /* --- NAVBAR --- */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 90%;
      max-width: 960px;
      padding: 0.75rem 1.25rem;
      background: rgba(18, 14, 28, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10;
      font-family: 'Orbitron', sans-serif;

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: #ffffff;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.2px;
    }

    .nav-links {

      align-items: center;
      gap: 1.75rem;
      list-style: none;
    }

    .nav-links a {

      cursor: pointer;
      font-weight: 500;
    }

    .nav-links a:hover {

    }

    /* --- HERO SECTION & GLITCH TEXT (FONT PRESERVED) --- */
    .hero-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-top: 3.5rem;
      padding-bottom: 1.5rem;
    }

    .glitch-text {
      color: #ffffff;
      font-size: clamp(2rem, 7vw, 5.5rem);
      font-weight: 900;
      letter-spacing: clamp(1px, 1vw, 4px);
      text-transform: uppercase;
      position: relative;
      display: block;
      line-height: 1.1;
      user-select: none;
      margin-bottom: 0.5rem;
      font-family: 'Orbitron', sans-serif; /* Kept Orbitron bold style for glitch */
    }

    .glitch-text::before,
    .glitch-text::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    .glitch-text::before {
      left: 3px;
      text-shadow: -3px 0 #ea4335;
      clip: rect(24px, 9999px, 90px, 0);
      animation: glitch-anim-1 2s infinite linear alternate-reverse;
    }

    .glitch-text::after {
      left: -3px;
      text-shadow: -3px 0 #4285f4;
      clip: rect(85px, 9999px, 140px, 0);
      animation: glitch-anim-2 2.5s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim-1 {
      0%   { clip: rect(15px, 9999px, 80px, 0); }
      20%  { clip: rect(60px, 9999px, 10px, 0); }
      40%  { clip: rect(30px, 9999px, 90px, 0); }
      60%  { clip: rect(80px, 9999px, 20px, 0); }
      80%  { clip: rect(10px, 9999px, 50px, 0); }
      100% { clip: rect(50px, 9999px, 30px, 0); }
    }

    @keyframes glitch-anim-2 {
      0%   { clip: rect(40px, 9999px, 10px, 0); }
      20%  { clip: rect(20px, 9999px, 70px, 0); }
      40%  { clip: rect(90px, 9999px, 30px, 0); }
      60%  { clip: rect(10px, 9999px, 80px, 0); }
      80%  { clip: rect(70px, 9999px, 15px, 0); }
      100% { clip: rect(30px, 9999px, 60px, 0); }
    }

  <!-- JAVASCRIPT: NAVIGATION & VIDEO SCROLL -->
  <script>
    const openMenuBtn = document.getElementById('openMenuBtn');
    const closeMenuBtn = document.getElementById('closeMenuBtn');
    const sideMenu = document.getElementById('sideMenu');
    const menuBackdrop = document.getElementById('menuBackdrop');
    const sideMenuLinks = document.querySelectorAll('.side-menu-links a');

    function openMenu() {
      sideMenu.classList.add('open');
      menuBackdrop.classList.add('open');
    }

    function closeMenu() {
      sideMenu.classList.remove('open');
      menuBackdrop.classList.remove('open');
    }

    openMenuBtn.addEventListener('click', openMenu);
    if (closeMenuBtn) closeMenuBtn.addEventListener('click', closeMenu);
    menuBackdrop.addEventListener('click', closeMenu);

    sideMenuLinks.forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    const video = document.getElementById('scrollVideo');
    let ticking = false;

    function updateVideoTime() {
      if (video.duration) {
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        const scrollFraction = Math.max(0, Math.min(1, window.scrollY / maxScroll));
        video.currentTime = scrollFraction * video.duration;
      }
      ticking = false;
    }

    window.addEventListener('scroll', () => {
      if (!ticking) {
        window.requestAnimationFrame(updateVideoTime);
        ticking = true;
      }
    });

    video.addEventListener('loadedmetadata', updateVideoTime);
  </script>

  <!-- BABEL REACT CAROUSEL COMPONENT -->
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { motion, useMotionValue, useTransform } = window.Motion;

    function CardRotate({ children, onSendToBack, sensitivity, disableDrag = false }) {
      const x = useMotionValue(0);
      const y = useMotionValue(0);
      const rotateX = useTransform(y, [-100, 100], [60, -60]);
      const rotateY = useTransform(x, [-100, 100], [-60, 60]);

      function handleDragEnd(_, info) {
        if (Math.abs(info.offset.x) > sensitivity || Math.abs(info.offset.y) > sensitivity) {
          onSendToBack();
        } else {
          x.set(0);
          y.set(0);
        }
      }

      if (disableDrag) {
        return (
          <motion.div className="card-rotate-disabled" style={{ x: 0, y: 0 }}>
            {children}
          </motion.div>
        );
      }

      return (
        <motion.div
          className="card-rotate"
          style={{ x, y, rotateX, rotateY }}
          drag
          dragConstraints={{ top: 0, right: 0, bottom: 0, left: 0 }}
          dragElastic={0.6}
          whileTap={{ cursor: 'grabbing' }}
          onDragEnd={handleDragEnd}
        >
          {children}
        </motion.div>
      );
    }

    function Stack({
      randomRotation = false,
      sensitivity = 200,
      cards = [],
      animationConfig = { stiffness: 260, damping: 20 },
      sendToBackOnClick = false,
      autoplay = false,
      autoplayDelay = 3000,
      pauseOnHover = false,
      mobileClickOnly = false,
      mobileBreakpoint = 768
    }) {
      const [isMobile, setIsMobile] = useState(false);
      const [isPaused, setIsPaused] = useState(false);

      useEffect(() => {
        const checkMobile = () => {
          setIsMobile(window.innerWidth < mobileBreakpoint);
        };

        checkMobile();
        window.addEventListener('resize', checkMobile);
        return () => window.removeEventListener('resize', checkMobile);
      }, [mobileBreakpoint]);

      const shouldDisableDrag = mobileClickOnly && isMobile;
      const shouldEnableClick = sendToBackOnClick || shouldDisableDrag;

      const [stack, setStack] = useState(() => {
        return cards.map((content, index) => ({ id: index + 1, content }));
      });

      useEffect(() => {
        if (cards.length) {
          setStack(cards.map((content, index) => ({ id: index + 1, content })));
        }
      }, [cards]);

      const sendToBack = id => {
        setStack(prev => {
          const newStack = [...prev];
          const index = newStack.findIndex(card => card.id === id);
          const [card] = newStack.splice(index, 1);
          newStack.unshift(card);
          return newStack;
        });
      };

      useEffect(() => {
        if (autoplay && stack.length > 1 && !isPaused) {
          const interval = setInterval(() => {
            const topCardId = stack[stack.length - 1].id;
            sendToBack(topCardId);
          }, autoplayDelay);

          return () => clearInterval(interval);
        }
      }, [autoplay, autoplayDelay, stack, isPaused]);

      return (
        <div
          className="stack-container"
          onMouseEnter={() => pauseOnHover && setIsPaused(true)}
          onMouseLeave={() => pauseOnHover && setIsPaused(false)}
        >
          {stack.map((card, index) => {
            const randomRotate = randomRotation ? Math.random() * 10 - 5 : 0;
            return (
              <CardRotate
                key={card.id}
                onSendToBack={() => sendToBack(card.id)}
                sensitivity={sensitivity}
                disableDrag={shouldDisableDrag}
              >
                <motion.div
                  className="card"
                  onClick={() => shouldEnableClick && sendToBack(card.id)}
                  animate={{
                    rotateZ: (stack.length - index - 1) * 4 + randomRotate,
                    scale: 1 + index * 0.05 - stack.length * 0.05,
                    transformOrigin: '90% 90%'
                  }}
                  initial={false}
                  transition={{
                    type: 'spring',
                    stiffness: animationConfig.stiffness,
                    damping: animationConfig.damping
                  }}
                >
                  {card.content}
                </motion.div>
              </CardRotate>
            );
          })}
        </div>
      );
    }

    function NotebookCard({ title, children }) {
      return (
        <div className="notebook-paper">
          <div className="notebook-holes">
            <div className="hole"></div>
            <div className="hole"></div>
            <div className="hole"></div>
            <div className="hole"></div>
            <div className="hole"></div>
          </div>
          <h2 className="paper-title">{title}</h2>
          <div className="paper-body">
            {children}
          </div>
        </div>
      );
    }

    function CarouselApp() {
      const cardsContent = [
        <NotebookCard key="stage4" title="Stage 4: Brand New Day">
          <p><strong>Focus:</strong> Communication & Presentation Pitch</p>
          <br />
          <p>Learn how to present complex technical ideas clearly to stakeholders, craft compelling project pitches, and demonstrate leadership like a seasoned developer.</p>
        </NotebookCard>,

        <NotebookCard key="stage3" title="Stage 3: No Way Home">
          <p><strong>Focus:</strong> Problem-Solving Optimization</p>
          <br />
          <p>Dive deep into algorithm optimization, data structure tuning, scalable software design, and high-performance debugging under strict deadlines.</p>
        </NotebookCard>,

        <NotebookCard key="stage2" title="Stage 2: Far From Home">
          <p><strong>Focus:</strong> Web Dev & UI/UX Concepts</p>
          <br />
          <p>Master modern web stacks, fluid layout systems, responsive UI components, and modern frontend frameworks to build production-grade web applications.</p>
        </NotebookCard>,

        <NotebookCard key="stage1" title="Stage 1: Homecoming">
          <p><strong>Focus:</strong> Logic & Analytical Thinking</p>
          <br />
          <p>Build core algorithmic thinking, master foundational programming principles, and sharpen logical problem-solving frameworks for engineering challenges.</p>
        </NotebookCard>,

        <NotebookCard key="overview" title="Bootcamp Overview">
          <p>The Spider-Man Bootcamp is an intensive, hands on skill building experience designed to transform engineering students into agile, full-stack problem solvers. From mastering basic logic to deploying sleek web interfaces and pitching under pressure, this journey maps directly to Peter Parker's evolution from a gifted kid to an independent hero.</p>
          
          <div className="paper-subtitle">Bootcamp Stages:</div>
          <ul className="paper-list">
            <li><strong>Stage 1: Homecoming</strong> – Logic & Analytical Thinking</li>
            <li><strong>Stage 2: Far From Home</strong> – Web Dev & UI/UX Concepts</li>
            <li><strong>Stage 3: No Way Home</strong> – Problem-Solving Optimization</li>
            <li><strong>Stage 4: Brand New Day</strong> – Communication & Presentation Pitch</li>
          </ul>
        </NotebookCard>
      ];

      return (
        <div className="stack-wrapper">
          <Stack
            randomRotation={true}
            sensitivity={150}
            sendToBackOnClick={true}
            cards={cardsContent}
            autoplay={false}
            pauseOnHover={false}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('stack-carousel-root'));
    root.render(<CarouselApp />);
  </script>
</body>
</html>
